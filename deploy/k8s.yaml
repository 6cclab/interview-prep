# A deployed drill instance, for a small known group.
#
# This instance belongs to one person. Authentik decides who may reach it; the
# app does not ask who is calling, because there is only one answer. A second
# person gets a second instance rather than a user id.
#
# That removes the thing that used to need defending: there is no
# `X-authentik-uid` to forge, so no gateway secret and no header-clearing
# middleware whose ORDER is load-bearing. What remains is one door.
#
# WARNING, if `VOICE_MULTI_USER` is ever switched on: the NetworkPolicy below
# does NOT work in this cluster. The CNI is flannel, which has no policy
# controller, so the object is accepted and silently enforces nothing — anything
# in the cluster can reach this Service directly, bypassing Traefik and
# Authentik entirely. With one user that costs confidentiality of one person's
# own data against in-cluster callers. With several it would mean forgeable
# identity, and the gateway secret would be doing the whole job alone.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: interview-prep
data:
  # The in-cluster address of `ollama-gateway`, which fronts several ollama
  # boxes behind one name. NOT a loopback address: `serverConfig` refuses to
  # start a deployed instance pointed at 127.0.0.1, because ollama's own
  # default is loopback and inside a container that reaches nothing.
  ollamaHost: http://ollama-gateway.ollama-gateway.svc.cluster.local
---
# One secret now. `gatewaySecret` went with the identity headers — it existed to
# prove a request came through the edge, and nothing here reads a header any
# more. It comes back with VOICE_MULTI_USER.
#
# The operator provisions a Secret named after this object from Infisical, the
# same way every other service in the cluster gets its credentials.
apiVersion: secrets.6cclab.dev/v1alpha1
kind: HomelabSecret
metadata:
  name: interview-prep-secrets
spec:
  # The Infisical project UUID. This project does not exist yet — create it and
  # put the UUID here before applying. Expected key: ollamaApiKey.
  projectId: REPLACE_WITH_INFISICAL_PROJECT_UUID
---
apiVersion: v1
kind: Service
metadata:
  name: interview-prep
spec:
  # Never NodePort or LoadBalancer. Either one puts the port somewhere the
  # middleware chain does not run, and the headers are trusted input there.
  type: ClusterIP
  selector:
    app: interview-prep
  ports:
    - port: 80
      targetPort: 4173
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-prep
spec:
  # Pinned to one, deliberately. `SessionStore` is an in-memory Map, so a
  # second pod would answer for sessions it has never heard of depending on
  # where the request landed — with no sticky routing and no shared store.
  # Raising this needs that solved first; it is not a scaling knob today.
  replicas: 1
  strategy:
    # A rolling update would briefly run two pods, which is the same problem.
    type: Recreate
  selector:
    matchLabels:
      app: interview-prep
  template:
    metadata:
      labels:
        app: interview-prep
    spec:
      containers:
        - name: server
          image: interview-prep:latest
          ports:
            - containerPort: 4173
          env:
            - name: VOICE_MODE
              value: deployed
            - name: VOICE_BACKEND
              value: ollama
            - name: OLLAMA_HOST
              valueFrom:
                configMapKeyRef: { name: interview-prep, key: ollamaHost }
            # No VOICE_MULTI_USER: this instance is one person's, and a second
            # person gets a second instance. That is what keeps two people's
            # drill logs apart — not identity handling inside the process.
            #
            # Switching it on turns every identity check back on at once
            # (`deriveUserId`, per-user directories, the coach allowlist, the
            # gateway secret), and then this needs VOICE_COACH_ALLOWLIST and
            # VOICE_GATEWAY_SECRET back. The code and its tests are all still
            # here; see `serverConfig`.
            #
            # `ollama-gateway` rejects every route but /healthz without this.
            # Absent means unauthenticated by design (`ollamaHeaders`), so a
            # missing key is a 401 on the first turn rather than a boot error.
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef: { name: interview-prep-secrets, key: ollamaApiKey }
          volumeMounts:
            - { name: users, mountPath: /app/local/users }
            # Models only. `whisper-cli` is built into the image — mounting the
            # binary made the image unrunnable anywhere but this cluster.
            - { name: whisper, mountPath: /opt/whisper/models, readOnly: true }
      volumes:
        # The only mutable state. Everything else — problems, solutions,
        # prompts — is baked into the image and rebuilt from the repo.
        - name: users
          persistentVolumeClaim: { claimName: interview-prep-users }
        - name: whisper
          persistentVolumeClaim: { claimName: whisper-models }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: interview-prep
spec:
  podSelector:
    matchLabels:
      app: interview-prep
  policyTypes: [Ingress]
  ingress:
    # Traefik only. Without this, anything in the cluster can reach the port
    # directly and set its own identity headers.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: traefik }
---
# The clear-identity and gateway-secret middlewares are gone with the headers
# they existed to make trustworthy. Both come back with VOICE_MULTI_USER, and
# the order matters when they do: clear, then authenticate, then stamp —
# `forwardAuth` does not strip a client-supplied header of the same name, so a
# chain that only sets lets a caller keep their own uid.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: interview-prep
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`drills.example.internal`)
      kind: Rule
      middlewares:
        # One door. Authentik decides who reaches the instance; the instance
        # does not ask which of them it is talking to.
        - name: authentik-forwardauth
      services:
        - name: interview-prep
          port: 80
