pattern: bounded-memory-io
title: Fetch a URL and Print It
difficulty: easy
budget: retention budget — a 200,000-chunk body must never leave more than a couple of chunks unwritten, which rejects collecting the body and writing it at the end
complexity:
  time: O(n) in the number of bytes; each byte is read once and written once
  space: O(1) — bounded by the largest single chunk, not by the response size
hints:
  nudge: What is the largest thing your solution ever holds at once, and does that number depend on how big the response is?
  approach: >-
    Iterate the async body with for-await and write each chunk as it arrives.
    That is the whole solution; the difficulty is resisting the accumulate-then-
    write shape, which reads naturally and is what the suite is built to catch.
    Do not wrap the loop in try/catch unless you intend to rethrow — an error
    partway through iteration must propagate, because a caller that gets a
    resolved promise will believe it received the whole body.
companies:
  - name: crowdstrike
    confidence: low
    source: >-
