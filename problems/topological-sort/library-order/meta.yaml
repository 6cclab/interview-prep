pattern: topological-sort
title: Library Initialization Order
difficulty: medium
budget: scale test — 200,000 libraries in a single dependency chain plus 150,000 isolated ones must finish well under 5s, which rejects the repeated-rescan solution (quadratic)
complexity:
  time: O(V + E) — every library and every dependency edge is examined a constant number of times
  space: O(V + E) for the adjacency structure and the pending-count map, plus the output
hints:
  nudge: You can safely initialize anything that has nothing left to wait for. What happens to the things that were waiting on it, and how do you avoid rescanning everything to find that out?
  approach: >-
    Count, for each library, how many dependencies it is still waiting on. Start
    with every library whose count is zero. Each time you take one, walk the
    libraries that depend on it and decrement their counts; any that reach zero
    become available. The counts are what let you avoid rescanning — you never
    look at a library until the moment it might have become ready. If the output
    ends up shorter than the input, the leftovers are exactly the ones trapped in
    a cycle. Unknown names are worth rejecting up front, before any of this.
